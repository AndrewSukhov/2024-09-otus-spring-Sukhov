<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Статистика библиотеки</title>
  <!-- Подключаем Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Подключаем Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    .stat-card {
      border-radius: 10px;
      transition: all 0.3s ease;
      border: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    .stat-number {
      font-size: 3rem;
      font-weight: bold;
      color: #0d6efd;
    }
    .stat-icon {
      font-size: 2rem;
      color: #0d6efd;
    }
  </style>
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row mb-4">
    <div class="col-12 text-center">
      <h1 class="display-5 fw-bold text-primary">Статистика библиотеки</h1>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card stat-card text-center p-4">
        <div class="card-body">
          <i class="bi bi-book stat-icon"></i>
          <h3 class="card-title">Всего книг в библиотеке</h3>
          <div class="stat-number" th:text="${totalBooks}">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12 text-center">
      <a th:href="@{/}" class="btn btn-primary">
        <i class="bi bi-arrow-left"></i> На главную
      </a>
    </div>
  </div>
</div>

<!-- Подключаем Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
