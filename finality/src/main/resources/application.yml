  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql
#      Раскомментировать в случае использования postgressql
#      schema-locations: classpath:postgressql-shema.sql

  jpa:
    generate-ddl: false
    show-sql: true # для отображения SQL-запросов в консоли
    hibernate:
      ddl-auto: none # чтобы Hibernate не управлял схемой базы данных

