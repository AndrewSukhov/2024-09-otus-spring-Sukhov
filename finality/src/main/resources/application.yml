# При желании подключить PostgresSQL через поднятие докер образа
# Команды докера
#  docker ps -a
#  docker volume ls
#  docker-compose up -d
#  docker stop postgres_container
#  docker rm postgres_container
#  docker volume rm finality_postgres_data

#  datasource:
#    url: jdbc:postgresql://localhost:5432/library
#    username: library
