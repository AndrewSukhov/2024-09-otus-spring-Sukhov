<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:insert="~{fragments/header :: head}"/>
    <title>Результаты поиска по тегу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tag-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
            border-left: 4px solid #0d6efd;
        }
        .tag-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .search-header {
            background-color: #f8f9fa;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <!-- Шапка с результатами поиска -->
    <div class="search-header text-center">
        <h1 class="display-5 fw-bold">Результаты поиска</h1>
        <p class="lead">По запросу: "<span class="text-primary" th:text="${tagSearchText}"></span>"</p>
        <a th:href="@{/}" class="btn btn-outline-primary mt-3">
            <i class="bi bi-arrow-left"></i> Новый поиск
        </a>
    </div>

    <!-- Блок с результатами -->
    <div th:if="${tags.empty}" class="text-center py-5">
        <div class="alert alert-warning">
            <h4 class="alert-heading">Ничего не найдено</h4>
            <p>Попробуйте изменить параметры поиска</p>
        </div>
    </div>

    <div th:unless="${tags.empty}">
        <h2 class="h4 mb-4 text-muted">Найдено тегов: <span class="badge bg-primary" th:text="${tags.size()}"></span></h2>

        <div class="row">
            <div th:each="tag : ${tags}" class="col-md-6">
                <div class="card tag-card h-100">
                    <div class="card-body">
                        <blocktag class="blocktag mb-4">
                            <p class="fs-5" th:text="${tag.text}"></p>
                        </blocktag>
                        <div class="d-flex justify-content-between align-items-center">
                                <span class="badge bg-secondary">
                                   Найдено. ID книги: <span th:text="${tag.bookId}"></span>
                                </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
